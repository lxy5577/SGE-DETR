# SGE-DETR: RT-DETR with three paper-level enhancement designs
# CPO = SOEP-RFPN-based P2-P3 collaborative optimization
#      (SPDConv + CSPOmniKernel + SNI)
# ETB = Entangled Transformer Block
# GCConv = Global-Context Convolution in the PAN bottom-up path

nc: 80
scales:
  l: [1.00, 1.00, 1024]  # [depth, width, max_channels]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]

head:
  # ETB at P5
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, ETB, [8]]
  - [-1, 1, Conv, [256, 1, 1]]

  # P4 lateral branch
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, Conv, [128, 1, 1]]

  # CPO: SOEP-RFPN P2-P3 collaborative enhancement
  - [4, 1, Conv, [128, 3, 2, None, 1, 1, False]]
  - [5, 1, SPDConv, [256, 2]]
  - [-1, 1, CSPOmniKernel, [1]]
  - [-1, 1, SNI, [2]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [[13, 17], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  # SNI reused for top-down feature alignment
  - [10, 1, SNI, [2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [22, 1, SNI, [2]]
  - [[-1, 19], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  # GCConv in PAN bottom-up aggregation
  - [25, 1, GCConv, [256, 3, 2]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [28, 1, GCConv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  - [[25, 28, 31], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
